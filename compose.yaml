name: royal-flush

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-royal_flush}
      POSTGRES_USER: ${POSTGRES_USER:-royal_flush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royal_flush_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-royal_flush}:${POSTGRES_PASSWORD:-royal_flush_dev}@postgres:5432/${POSTGRES_DB:-royal_flush}?sslmode=disable"
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-local-admin}
      INSTANCE_ID: ${INSTANCE_ID:-local-compose-1}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PORT: "8080"
      API_UPSTREAM: http://server:8080
    ports:
      - "5173:8080"
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      PORT: "8080"
      API_UPSTREAM: http://server:8080
    ports:
      - "5174:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
