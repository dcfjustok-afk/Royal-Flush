name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  node:
    name: Node tests, contracts, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check generated contracts
        run: npm run contracts:check

  playwright:
    name: Playwright browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7

  capacity-smoke:
    name: Realtime capacity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - name: Start in-memory server
        env:
          ENVIRONMENT: development
          PORT: 8080
        run: |
          go build -o "$RUNNER_TEMP/royal-flush-server" ./cmd/server
          "$RUNNER_TEMP/royal-flush-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/ready > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run capacity smoke
        run: |
          go run ./cmd/loadtest \
            -target http://127.0.0.1:8080 \
            -connections 16 \
            -rooms 4 \
            -actions 4 \
            -reconnects 4 \
            -output "$RUNNER_TEMP/capacity-report.json"
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - name: Upload capacity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-smoke-report
          path: ${{ runner.temp }}/capacity-report.json
          if-no-files-found: warn
      - name: Stop server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/server.pid"; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" || true
          fi

  docker-images:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [server, web, admin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build --file "Dockerfile.${{ matrix.service }}" --tag "royal-flush-${{ matrix.service }}:ci" .

  deployment-gate:
    name: Deployment gate
    if: ${{ always() }}
    needs: [go, node, playwright, capacity-smoke, docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          GO_RESULT: ${{ needs.go.result }}
          NODE_RESULT: ${{ needs.node.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          CAPACITY_RESULT: ${{ needs['capacity-smoke'].result }}
          DOCKER_RESULT: ${{ needs['docker-images'].result }}
        run: |
          for result in "$GO_RESULT" "$NODE_RESULT" "$PLAYWRIGHT_RESULT" "$CAPACITY_RESULT" "$DOCKER_RESULT"; do
            if test "$result" != "success"; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded; this revision is ready for deployment."
          {
            echo "## Deployment gate passed"
            echo
            echo "Go, Node, browser, capacity, and all three production images are verified."
          } >> "$GITHUB_STEP_SUMMARY"
